name: CST-250 Milestone 6 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/milestone6-build.yml'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate Milestone 6 solution
        id: locate
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Recurse -Filter MinesweeperMilestone6.sln | Select-Object -First 1
          if (-not $solution) { throw 'MinesweeperMilestone6.sln was not found.' }
          "solution=$($solution.FullName)" >> $env:GITHUB_OUTPUT
          $tests = Get-ChildItem -Path $solution.Directory.FullName -Recurse -Filter MinesweeperClassLibrary.Tests.csproj | Select-Object -First 1
          if (-not $tests) { throw 'MinesweeperClassLibrary.Tests.csproj was not found.' }
          "tests=$($tests.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore "${{ steps.locate.outputs.solution }}"

      - name: Build Release
        run: dotnet build "${{ steps.locate.outputs.solution }}" --configuration Release --no-restore --warnaserror

      - name: Run tests
        run: dotnet test "${{ steps.locate.outputs.tests }}" --configuration Release --no-build --logger "console;verbosity=normal"
